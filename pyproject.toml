[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "passport-to-uml"
version = "1.0.0"
description = "Extract functional UML diagrams from technical passport PDFs"
readme = "README.md"
license = {text = "MIT"}
keywords = ["pdf", "uml", "passport", "diagram", "gost", "documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Engineering",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Office/Business :: Financial :: Document Processing",
]

authors = [
    {name = "kostyk348", email = "kostyk348@users.noreply.github.com"},
]

requires-python = ">=3.9"

dependencies = [
    "pdfplumber>=0.7",
    "graphviz>=0.20",
]

[project.urls]
Homepage = "https://github.com/kostyk348/passport-to-uml"
Repository = "https://github.com/kostyk348/passport-to-uml"
BugTracker = "https://github.com/kostyk348/passport-to-uml/issues"

[project.scripts]
passport-to-uml = "passport_to_uml.engine:main"

[tool.setuptools.packages.find]
include = ["passport_to_uml*"]
